<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>A Sample Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
    .top-frame { height: 135px; width: 100%; border: none; }
    .middle-container { flex: 1; display: flex; width: 100%; height: calc(100% - 165px); }
    .main-frame { flex: 1; height: 100%; border: none; }
    .ad-frame { width: 200px; height: 100%; border: none; }
    .footer-frame { height: 30px; width: 100%; border: none; }
  </style>
</head>
<body>
  <iframe src="top.html" class="top-frame" scrolling="no"></iframe>
  <div class="middle-container">
    <iframe src="home.html" name="main" class="main-frame"></iframe>
    <iframe src="advertise.html" class="ad-frame" scrolling="no"></iframe>
  </div>
  <iframe src="footer.html" class="footer-frame" scrolling="no"></iframe>
</body>
</html>
